<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centauro Chess - Visor de Partidas PGN</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Estilos personalizados para el tablero */
        #board {
            width: 100%;
            max-width: 80vh;
            /* Allow board to be large but fit vertically */
            margin: 0 auto;
        }

        /* Garantiza que el tablero sea responsivo */
        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            height: 100%;
        }

        /* Estilo para el contenedor del tablero de chessboard.js */
        .square-55d63 {
            position: relative;
        }

        /* Sombra y estilo para botones */
        .chess-button {
            transition: all 0.1s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        .chess-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.15), 0 4px 6px -3px rgba(0, 0, 0, 0.1);
        }

        .chess-button:active {
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
    <!-- Fuentes: Inter para una estética moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'chess-dark': '#4f46e5', /* Indigo */
                        'chess-light': '#818cf8', /* Light Indigo */
                        'board-light': '#f0d9b5',
                        'board-dark': '#b58863',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-transparent text-slate-200 h-full overflow-y-auto">
    <!-- Dependencias de Ajedrez -->
    <!-- FIX: Agregamos jQuery, ya que chessboard.js 1.0.0 lo requiere como dependencia -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>

    <div class="container mx-auto p-4 w-full max-w-full">
        <h1 class="text-2xl font-bold text-center text-white mb-6 tracking-wide">
            Visor PGN <span class="text-indigo-400">Legacy</span>
        </h1>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-8 h-full">
            <!-- Columna Izquierda: Tablero -->
            <div class="order-2 lg:order-1">
                <div class="bg-indigo-950/30 p-4 rounded-xl shadow-2xl border border-indigo-500/20 backdrop-blur-sm">
                    <div class="board-container">
                        <div id="board" class="shadow-2xl rounded-lg overflow-hidden border-4 border-slate-700"></div>
                    </div>
                </div>

                <!-- Controles de Navegación -->
                <div id="controls" class="mt-6 bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex justify-center items-center space-x-3 mb-4 text-sm font-mono text-indigo-300">
                        <span>MOVIMIENTO</span>
                        <span id="move-counter" class="bg-indigo-900 px-3 py-1 rounded text-white font-bold">0 /
                            0</span>
                    </div>

                    <div class="flex justify-center gap-2">
                        <button id="start-btn"
                            class="chess-button bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg transition-colors disabled:opacity-50"
                            onclick="goToStart()" title="Inicio">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <button id="prev-btn"
                            class="chess-button bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg transition-colors disabled:opacity-50"
                            onclick="goBack()" title="Anterior">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <button id="next-btn"
                            class="chess-button bg-green-600 hover:bg-green-500 text-white p-3 rounded-lg transition-colors disabled:opacity-50"
                            onclick="goForward()" title="Siguiente">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                                </path>
                            </svg>
                        </button>
                        <button id="end-btn"
                            class="chess-button bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg transition-colors disabled:opacity-50"
                            onclick="goToEnd()" title="Final">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Input e Historial -->
            <div class="order-1 lg:order-2 space-y-6">
                <!-- Contenedor de Carga PGN -->
                <div class="bg-slate-800/80 p-6 rounded-xl border border-slate-700/50 shadow-lg">
                    <h2 class="text-lg font-semibold text-white mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Cargar Partida
                    </h2>
                    <textarea id="pgn-input" rows="4"
                        class="w-full p-3 bg-slate-900 border border-slate-600 rounded-lg text-sm font-mono text-slate-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none resize-none placeholder-slate-600"
                        placeholder="Pega tu PGN aquí..."></textarea>

                    <div class="flex gap-2 mt-4">
                        <button onclick="loadPgnText()"
                            class="flex-1 bg-green-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-green-500 transition text-sm">
                            Cargar Texto
                        </button>
                        <label for="pgn-file-input"
                            class="flex-1 bg-slate-700 text-slate-200 font-medium py-2 px-4 rounded-lg cursor-pointer hover:bg-slate-600 transition text-center text-sm flex items-center justify-center">
                            Subir Archivo
                        </label>
                        <input type="file" id="pgn-file-input" accept=".pgn" style="display: none;"
                            onchange="loadPgnFile(event)">
                    </div>

                    <p id="error-message"
                        class="text-red-400 text-sm mt-3 hidden text-center bg-red-900/20 p-2 rounded border border-red-900/50">
                    </p>
                </div>

                <!-- Historial de Movimientos -->
                <div
                    class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/50 flex-1 min-h-[200px] flex flex-col">
                    <h3
                        class="font-semibold mb-2 text-slate-400 text-sm uppercase tracking-wider border-b border-slate-700 pb-2">
                        Historial</h3>
                    <div id="move-history"
                        class="text-sm text-slate-300 font-mono leading-relaxed overflow-y-auto max-h-60 custom-scrollbar">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales para el juego y el tablero
        let game = new Chess();
        let board = null;
        let moves = [];
        let currentMoveIndex = -1;
        const errorMessageDiv = document.getElementById('error-message');


        // Inicializa el tablero
        function initBoard() {
            const config = {
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                draggable: true, // Enable dragging
                position: 'start',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);

            // Ajustar el tamaño del tablero
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const size = entry.contentRect.width;
                    board.resize(size);
                }
            });
            resizeObserver.observe(document.getElementById('board'));

            updateMoveCounter();
        }

        // Helper to get game state at current index
        function getGameAtCurrentIndex() {
            const tempGame = new Chess();
            // Replay moves up to current index
            for (let i = 0; i <= currentMoveIndex; i++) {
                tempGame.move(moves[i]);
            }
            return tempGame;
        }

        function onDragStart(source, piece, position, orientation) {
            const tempGame = getGameAtCurrentIndex();

            // Do not pick up pieces if the game is over
            if (tempGame.game_over()) return false;

            // Only pick up pieces for the side to move
            if ((tempGame.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (tempGame.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            const tempGame = getGameAtCurrentIndex();

            // see if the move is legal
            const move = tempGame.move({
                from: source,
                to: target,
                promotion: 'q' // NOTE: always promote to a queen for example simplicity
            });

            // illegal move
            if (move === null) return 'snapback';

            // Legal move: Update history
            // Truncate future history if we were in the middle of a game
            moves = moves.slice(0, currentMoveIndex + 1);

            // Add new move
            moves.push(move.san);

            // Advance index
            currentMoveIndex++;


            // Update UI
            updateBoard();

            // Trigger Computer Repsonse if game is not over
            if (!tempGame.game_over()) {
                // Pequeño delay para que se sienta natural
                setTimeout(triggerComputerMove, 250);
            }
        }

        function onSnapEnd() {
            // Update board position after piece snap (important for castling, en passant, promotion)
            updateBoard();
        }

        // Carga la partida desde el texto de la caja de texto
        function loadPgnText() {
            const pgnText = document.getElementById('pgn-input').value;
            loadGame(pgnText);
        }

        // Carga la partida desde un archivo subido
        function loadPgnFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                loadGame(e.target.result);
            };
            reader.readAsText(file);
        }

        // Lógica principal para cargar el PGN
        function loadGame(pgn) {
            errorMessageDiv.classList.add('hidden');

            // Resetear el juego y cargar el PGN
            game.reset();
            const success = game.load_pgn(pgn);

            if (success) {
                // Obtener todos los movimientos de la partida
                moves = game.history();

                // Reiniciar el juego a la posición inicial para mostrar los movimientos
                game.reset();
                currentMoveIndex = -1;
                board.position(game.fen());

                updateMoveCounter();
                updateMoveHistory();
            } else {
                errorMessageDiv.textContent = 'Error: No se pudo cargar la partida PGN. Asegúrate de que el formato sea correcto.';
                errorMessageDiv.classList.remove('hidden');

                // Limpiar el tablero si falla la carga
                game.reset();
                moves = [];
                currentMoveIndex = -1;
                board.position('start');
                updateMoveCounter();
                updateMoveHistory();
            }
        }


        // Actualiza el contador de movimientos y la posición en el tablero
        function updateBoard() {
            const tempGame = getGameAtCurrentIndex();
            board.position(tempGame.fen());

            updateMoveCounter();
            updateMoveHistory();
        }

        // Navegación de la partida

        function goForward() {
            if (currentMoveIndex < moves.length - 1) {
                currentMoveIndex++;
                updateBoard();
            }
        }

        function goBack() {
            if (currentMoveIndex >= 0) {
                currentMoveIndex--;
                updateBoard();
            }
        }

        function goToStart() {
            currentMoveIndex = -1;
            updateBoard();
        }

        function goToEnd() {
            currentMoveIndex = moves.length - 1;
            updateBoard();
        }

        // Actualiza el texto del contador de movimientos
        function updateMoveCounter() {
            document.getElementById('move-counter').textContent = `${currentMoveIndex + 1} / ${moves.length}`;

            // Deshabilitar botones en los límites
            document.getElementById('start-btn').disabled = currentMoveIndex <= -1;
            document.getElementById('prev-btn').disabled = currentMoveIndex <= -1;
            document.getElementById('next-btn').disabled = currentMoveIndex >= moves.length - 1;
            document.getElementById('end-btn').disabled = currentMoveIndex >= moves.length - 1;
        }

        // Muestra el historial de movimientos de forma simple
        function updateMoveHistory() {
            if (moves.length === 0) {
                document.getElementById('move-history').textContent = "Cargue una partida para ver el historial...";
                return;
            }

            const pgn = game.pgn().replace(/(\[.*?\])/g, '').trim(); // Elimina etiquetas

            // Resaltar el movimiento actual
            let highlightedPgn = pgn.replace(/(\d+\.)\s*([^\s]+)/g, (match, moveNumber, move) => {
                // Determina el índice de los movimientos en el array 'moves'
                const moveNumberInt = parseInt(moveNumber.replace('.', ''));
                const indexWhite = moveNumberInt * 2 - 2;
                const indexBlack = moveNumberInt * 2 - 1;

                let part1 = '';
                if (moves[indexWhite]) {
                    const isWhiteCurrent = indexWhite === currentMoveIndex;
                    part1 = `<span ${isWhiteCurrent ? 'class="bg-yellow-300 rounded px-1 font-bold"' : ''}>${moveNumber} ${moves[indexWhite]}</span>`;
                }

                let part2 = '';
                if (moves[indexBlack]) {
                    const isBlackCurrent = indexBlack === currentMoveIndex;
                    part2 = `<span ${isBlackCurrent ? 'class="bg-yellow-300 rounded px-1 font-bold"' : ''}>${moves[indexBlack]}</span>`;
                }

                // Devolvemos el número de movimiento seguido por los movimientos de Blancas y Negras
                return `${part1} ${part2}`;
            });

            document.getElementById('move-history').innerHTML = highlightedPgn.trim();
        }

        // Inicializar el tablero cuando la ventana cargue
        window.onload = initBoard;



        // Añadir soporte para teclado (opcional, pero mejora UX)
        document.addEventListener('keydown', function (event) {
            if (moves.length > 0) {
                if (event.key === 'ArrowRight') {
                    goForward();
                } else if (event.key === 'ArrowLeft') {
                    goBack();
                } else if (event.key === 'Home') {
                    goToStart();
                } else if (event.key === 'End') {
                    goToEnd();
                }
            }
        });

        // Escuchar mensajes desde la ventana padre (React)
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.type === 'LOAD_PGN' && data.pgn) {
                // Actualizar el textarea visualmente también
                const pgnInput = document.getElementById('pgn-input');
                if (pgnInput) pgnInput.value = data.pgn;

                loadGame(data.pgn);
            }
        });

        // --- INTEGRACIÓN DE STOCKFISH ---
        let stockfish = null;
        let isComputerThinking = false;

        function initStockfish() {
            // Asumiendo que stockfish.js está en la raíz de public/ junto con visor.html
            stockfish = new Worker('stockfish.js');

            stockfish.onmessage = function (event) {
                const line = event.data;

                // console.log('Stockfish says: ' + line);

                if (line.startsWith('bestmove')) {
                    const bestMove = line.split(' ')[1];
                    makeComputerMove(bestMove);
                    isComputerThinking = false;
                }
            };

            stockfish.postMessage('uci');
            stockfish.postMessage('isready');
        }

        function triggerComputerMove() {
            if (!stockfish) initStockfish();

            // Check if game is over before triggering
            const tempGame = getGameAtCurrentIndex();
            if (tempGame.game_over()) return;

            const gameFen = tempGame.fen();
            isComputerThinking = true;

            stockfish.postMessage('position fen ' + gameFen);
            stockfish.postMessage('go depth 10'); // Profundidad 10 para respuesta rápida
        }

        function makeComputerMove(bestMoveSanOrLan) {
            if (!bestMoveSanOrLan || bestMoveSanOrLan === '(none)') return;

            // Stockfish devuelve movimientos en formato "e2e4" (LAN)
            const from = bestMoveSanOrLan.substring(0, 2);
            const to = bestMoveSanOrLan.substring(2, 4);
            const promotion = bestMoveSanOrLan.length > 4 ? bestMoveSanOrLan.substring(4, 5) : 'q';

            const tempGame = getGameAtCurrentIndex();
            const move = tempGame.move({
                from: from,
                to: to,
                promotion: promotion
            });

            if (move) {
                // Update global moves
                moves = moves.slice(0, currentMoveIndex + 1);
                moves.push(move.san);
                currentMoveIndex++;
                updateBoard();
            }
        }

        // Initialize engine on load
        initStockfish();

    </script>
</body>

</html>
