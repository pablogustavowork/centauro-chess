<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentaUros Chess - Analysis Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        #board {
            width: 100%;
            margin: 0 auto;
        }

        .board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
</head>

<body>
    <div class="board-container">
        <div id="board"></div>
    </div>
    <script>
        // State
        let game = new Chess();
        let board = null;
        let moves = [];
        let globalPgn = "";
        let currentFen = 'start';
        let isInteractive = false;
        let playerSide = 'w';

        // Init
        function initBoard() {
            if (board && typeof board.destroy === 'function') {
                // 0.10.3 doesn't have destroy? 1.0.0 does. 
                // If destroys fails, just recreate logic.
                board.destroy();
            }

            const config = {
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                draggable: isInteractive,
                position: currentFen,
                orientation: playerSide === 'w' ? 'white' : 'black',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            try {
                board = Chessboard('board', config);
            } catch (e) {
                console.error("Board init error:", e);
            }

            // Window Resize Handler (Simpler/Safer than ResizeObserver for Iframe)
            window.removeEventListener('resize', resizeBoard);
            window.addEventListener('resize', resizeBoard);

            // Initial resize
            setTimeout(resizeBoard, 100);
        }

        function resizeBoard() {
            if (board) board.resize();
        }

        // --- Logic ---

        function loadGlobalGame(pgn) {
            try {
                globalPgn = pgn;
                game.reset();
                // Check if PGN string is valid
                if (!pgn || pgn.trim() === "") {
                    // Just reset
                    currentFen = 'start';
                    board.position('start');
                    return;
                }

                const success = game.load_pgn(pgn);
                if (success) {
                    moves = game.history();
                    // Check for FEN in PGN (Custom Start)
                    const header = game.header();
                    if (header && header['FEN']) {
                        currentFen = header['FEN'];
                    } else {
                        currentFen = 'start';
                    }

                    // Display start position
                    board.position(currentFen);
                    notifyStateUpdate(currentFen, "", 0);
                } else {
                    console.error("Failed to load PGN", pgn);
                    // Fallback to avoid dead state
                    game.reset();
                    board.position('start');
                }
            } catch (e) {
                console.error("Error loading global game:", e);
            }
        }

        function updateBoardAt(index) {
            try {
                // index is 0-based index of the move made (0 = 1. e4)
                // -1 = Start Position

                if (index < 0) {
                    // Reset to game start (which might be custom FEN)
                    const tempGame = new Chess();
                    // Extract FEN from global PGN if needed for replay
                    const fenMatch = globalPgn ? globalPgn.match(/\[FEN\s+"([^"]+)"\]/) : null;
                    if (fenMatch && fenMatch[1]) {
                        currentFen = fenMatch[1];
                    } else {
                        currentFen = 'start';
                    }
                    // Safe positional update
                    if (board) board.position(currentFen);
                    notifyStateUpdate(currentFen, "", 0); // ply 0
                    return;
                }

                if (globalPgn) {
                    const tempGame = new Chess();
                    // Load Start FEN
                    const fenMatch = globalPgn.match(/\[FEN\s+"([^"]+)"\]/);
                    if (fenMatch && fenMatch[1]) {
                        tempGame.load(fenMatch[1]);
                    }

                    // Replay moves up to index
                    let lastSan = "";
                    for (let i = 0; i <= index; i++) {
                        if (moves[i]) {
                            const res = tempGame.move(moves[i]);
                            if (res) lastSan = res.san;
                        }
                    }

                    currentFen = tempGame.fen();
                    if (board) board.position(currentFen);
                    notifyStateUpdate(currentFen, lastSan, index + 1);
                }
            } catch (e) {
                console.error("Error updating board:", e);
            }
        }

        function enableInteraction(enabled, side) {
            isInteractive = enabled;
            playerSide = side || 'w';
            // Re-init to update config (draggable/orientation)
            initBoard();
        }

        function loadFen(fen) {
            game.load(fen);
            currentFen = fen;
            board.position(fen);
            notifyStateUpdate(fen, "", -1); // unknown ply
        }

        // --- Interaction Handlers ---

        function onDragStart(source, piece, position, orientation) {
            if (!isInteractive) return false;

            // Only pick up pieces for the player's side
            const pieceColor = piece.charAt(0); // 'w' or 'b'
            if (playerSide === 'w' && pieceColor !== 'w') return false;
            if (playerSide === 'b' && pieceColor !== 'b') return false;

            // Prevent moving if game over logic? (Left for React control)
            return true;
        }

        function onDrop(source, target) {
            if (!isInteractive) return 'snapback';

            // Validate with local chess.js
            const temp = new Chess(currentFen);
            const move = temp.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            currentFen = temp.fen();

            // Emit to Parent
            window.parent.postMessage({
                type: 'MOVE_ATTEMPT',
                source: source,
                target: target,
                promotion: 'q',
                fen: currentFen,
                san: move.san
            }, '*');

            // We allow the visual drop. React will send LOAD_FEN if it rejects it.
        }

        function onSnapEnd() {
            // board.position(currentFen); // optional sync
        }

        function notifyStateUpdate(fen, san, ply) {
            window.parent.postMessage({
                type: 'STATE_UPDATE',
                fen: fen,
                san: san,
                ply: ply
            }, '*');
        }

        // --- Event Listeners ---
        window.onload = initBoard;

        window.addEventListener('message', (event) => {
            const data = event.data;
            switch (data.type) {
                case 'LOAD_PGN': loadGlobalGame(data.pgn); break;
                case 'GOTO_MOVE': updateBoardAt(data.index); break;
                case 'LOAD_FEN': loadFen(data.fen); break;
                case 'ENABLE_INTERACTION': enableInteraction(data.enabled, data.side); break;
            }
        });
    </script>
</body>

</html>
